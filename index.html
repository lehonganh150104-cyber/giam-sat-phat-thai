"fq.src":["Số liệu phát thải lấy từ đâu, cập nhật khi nào?","Where do the emission figures come from and when were they updated?"],"fa.src":["Từ Climate TRACE API v6: ước tính dựa trên ảnh vệ tinh và mô hình, không phải số kiểm kê do nhà máy kê khai. Lần tải gần nhất: {d}. Mỗi trang hồ sơ ghi rõ nguồn và ngày cập nhật của từng chỉ tiêu.","From the Climate TRACE API v6: estimates built from satellite imagery and models, not plant-reported inventories. Last download: {d}. Each profile page shows the source and update date of every indicator."],
"fq.legal":["Có dùng số liệu này để nộp báo cáo kiểm kê chính thức được không?","Can I use these figures for an official inventory report?"],"fa.legal":["Không thay thế được. Báo cáo kiểm kê theo Nghị định 06/2022 (sửa đổi bởi Nghị định 119/2025) do chính cơ sở lập theo hướng dẫn của Bộ và phải qua thẩm định. Nền tảng dùng để tham khảo, đối chiếu và phát hiện chỗ cần kiểm tra trước khi nộp.","No. Inventories under Decree 06/2022 (amended by Decree 119/2025) are prepared by the facility under ministry guidance and must be verified. The platform is for reference, cross-checking and spotting what to check before filing."],
"fq.trust":["Điểm tin cậy nghĩa là gì?","What does the trust score mean?"],"fa.trust":["Thang 0 đến 100 gồm 5 phần: độ tin cậy của nguồn (30), số liệu riêng hay giá trị mặc định (25), hợp lý về vật lý (20), chuỗi thời gian (15), có kiểm kê doanh nghiệp đối chiếu (10). Hạng A từ 75, B từ 55, C từ 35, còn lại D.","A 0 to 100 scale with 5 parts: source confidence (30), plant-specific versus default values (25), physical plausibility (20), time series (15), company inventory check (10). Grade A from 75, B from 55, C from 35, otherwise D."],
"fq.def":["Vì sao nhiều nhà máy có hệ số giống hệt nhau?","Why do many plants share the exact same factor?"],"fa.def":["Khi thiếu dữ liệu riêng, nguồn ước tính dùng giá trị mặc định cho cả nhóm. Nền tảng đánh dấu những nhà máy này để bạn biết số nào cần kiểm chứng thêm.","When plant data is missing, the estimate uses a group default. The platform flags these plants so you know which figures need checking."],
"fq.inv":["Doanh nghiệp tự kiểm kê trên web thế nào?","How does a company run its own inventory here?"],"fa.inv":["Vào Kiểm kê theo tháng, nhập nhiên liệu, điện, sản lượng của 12 tháng hoặc tải tệp CSV. Web tự tính theo hệ số IPCC, gắn cờ tháng bất thường, ghi nhật ký mọi lần sửa và xuất báo cáo.","Open Monthly inventory, enter 12 months of fuel, power and output or upload a CSV. The web calculates with IPCC factors, flags unusual months, logs every edit and exports a report."],
"fq.priv":["Dữ liệu tôi nhập có bị gửi đi đâu không?","Is the data I enter sent anywhere?"],"fa.priv":["Không. Số liệu kiểm kê, ghi chú, nhà máy gắn sao chỉ lưu trong trình duyệt trên máy bạn. Bạn sao lưu hoặc xóa ở mục Lưu trữ.","No. Inventory figures, notes and starred plants stay in your browser on this device. Back them up or clear them under Storage."],
"fq.cbam":["Chi phí CBAM được tính ra sao?","How is the CBAM cost estimated?"],"fa.cbam":["Lấy lượng phát thải gắn trong hàng xuất sang EU nhân giá chứng chỉ CBAM, trừ phần được miễn theo lộ trình. Đây là kịch bản tham khảo; số phải nộp thật phụ thuộc số liệu đã thẩm định của nhà nhập khẩu EU.","Embedded emissions in goods exported to the EU times the CBAM certificate price, minus the free share under the phase-in. It is a reference scenario; the real amount depends on verified data from the EU importer."],
"fq.no2":["NO2 vệ tinh là gì, sao có nhà máy chưa có?","What is satellite NO2 and why is it missing for some plants?"],"fa.no2":["Sentinel-5P đo mật độ NO2, dấu hiệu của quá trình đốt nhiên liệu; nó không đo trực tiếp CO2. Chuỗi số liệu chỉ có khi đã kết nối khóa Copernicus để chạy tải dữ liệu hằng tuần.","Sentinel-5P measures NO2 columns, a sign of combustion; it does not measure CO2 directly. The series appears once the Copernicus key is connected for the weekly download."],
"fq.reg":["Miền Bắc, Trung, Nam được chia thế nào?","How are North, Central and South defined?"],"fa.reg":["Chia gần đúng theo vĩ độ của nhà máy vì dữ liệu gốc không ghi tỉnh: Bắc từ 19,8°B, Trung từ 12,4° đến 19,8°B, Nam dưới 12,4°B.","Approximated by plant latitude since the source has no province: North from 19.8°N, Central 12.4 to 19.8°N, South below 12.4°N."],
"fq.set":["Đổi ngôn ngữ, tiền tệ, hệ số lưới điện ở đâu?","Where do I change language, currency or the grid factor?"],"fa.set":["Ở mục Cài đặt. Ngôn ngữ và tiền tệ cũng đổi nhanh được ở góc trên trang.","Under Settings. Language and currency can also be switched at the top of the page."],
"fq.use":["Tôi có được dùng lại nội dung trang này không?","May I reuse content from this site?"],"fa.use":["Số liệu Climate TRACE dùng theo giấy phép CC BY 4.0, cần ghi nguồn. Giao diện, mã nguồn, cách chấm điểm và phân tích của nền tảng thuộc bản quyền Lê Hồng Anh; muốn sử dụng cần xin phép trước.","Climate TRACE data is under CC BY 4.0 with attribution. The interface, code, scoring and analysis belong to Le Hong Anh; ask for permission before using them."],
"fq.pilot":["Doanh nghiệp muốn thử nghiệm cùng nền tảng thì làm sao?","How can a company join a pilot?"],"fa.pilot":["Gửi tin nhắn ở mục Liên hệ hỗ trợ, chọn chủ đề Hợp tác thử nghiệm, nêu ngành, quy mô và loại số liệu có thể chia sẻ.","Send a message under Contact support, choose Pilot partnership, and state your sector, size and the data you could share."],

"dk.s1N":["Cường độ lấy từ ước tính Climate TRACE; nhà máy dùng giá trị mặc định có thể dồn về cùng một điểm. Nhập kiểm kê thật để so chính xác hơn.","Intensity comes from Climate TRACE estimates; plants on default values can cluster at one point. Enter a real inventory for a sharper comparison."],
"dk.s2":["Nghĩa vụ và mốc thời gian","Obligations and deadlines"],"dk.likely":["Nhà máy này có khả năng thuộc diện kiểm kê bắt buộc (nhiệt điện, hoặc phát thải ước tính từ 3.000 t CO2e/năm). Hãy xác nhận tên trong danh sách chính thức.","This plant is likely subject to mandatory inventory (thermal power, or estimated emissions of 3,000 t CO2e/yr or more). Confirm its name in the official list."],"dk.unlikely":["Phát thải ước tính dưới ngưỡng 3.000 t CO2e/năm; vẫn có thể thuộc danh mục theo ngưỡng năng lượng. Hãy kiểm tra danh sách chính thức.","Estimated emissions are under 3,000 t CO2e/yr; it may still be listed under the energy threshold. Check the official list."],

"dk.s3":["Kịch bản chi phí hạn ngạch","Quota cost scenario"],"dk.s3C":["Tính theo quy tắc: bù trừ bằng tín chỉ tối đa 30% hạn ngạch được phân bổ (Điều 19.8.a), vay tối đa 15% hạn ngạch kỳ sau đến 2030 (Điều 19.6.a). Mọi con số dưới đây là kịch bản bạn tự đặt.","Rules applied: offsets up to 30% of allocated quota (Art. 19.8.a), borrowing up to 15% of next-period quota until 2030 (Art. 19.6.a). Every number below is a scenario you set."],

"dk.mx":["Ma trận rủi ro chi phí","Cost risk matrix"],"dk.mxE":["Phát thải","Emissions"],"dk.mxP":["Giá","Price"],"dk.mxN":["Hàng: sai số ±10% của số phát thải; cột: giá giảm một nửa hoặc tăng gấp đôi. Ô đỏ là chi phí, ô xanh là giá trị phần dư. Dự thảo nghị định xử phạt (07/2026) đề xuất phạt 300 đến 400 triệu đồng khi vượt hạn ngạch từ 5.000 t, chưa có hiệu lực.","Rows: ±10% emission error; columns: price halved or doubled. Red cells are cost, green cells are surplus value. A draft penalty decree (07/2026) proposes 300 to 400 million VND fines for exceeding quota by 5,000 t or more; not yet in force."],

"pol.k1":["Trong nước","Domestic"],"pol.h1":["Kiểm kê bắt buộc và thị trường carbon","Mandatory inventory and a carbon market"],"pol.p1":["Nghị định 06/2022/NĐ-CP yêu cầu cơ sở trong danh mục kiểm kê khí nhà kính định kỳ và đặt lộ trình thị trường carbon trong nước. Nhiệt điện, thép, xi măng là nhóm phát thải lớn nhất trong danh mục.","Decree 06/2022/ND-CP requires listed facilities to run regular GHG inventories and sets a roadmap for a domestic carbon market. Thermal power, steel and cement are the largest emitters on the list."],
"pol.k2":["Xuất khẩu","Exports"],"pol.h2":["CBAM của Liên minh châu Âu","The EU CBAM"],"pol.p2":["Từ 2026, nhà nhập khẩu EU phải mua chứng chỉ cho phát thải gắn với thép, xi măng, nhôm, phân bón, điện và hydro. Doanh nghiệp xuất khẩu cần số liệu cấp nhà máy kiểm chứng được.","From 2026, EU importers must buy certificates for emissions embedded in steel, cement, aluminium, fertiliser, electricity and hydrogen. Exporters need verifiable plant-level data."],
"pol.k3":["Kiểm chứng","Verification"],"pol.h3":["Vệ tinh là lớp đối chiếu độc lập","Satellites as an independent cross-check"],"pol.p3":["Ước tính vệ tinh không thay kiểm kê, nhưng giúp phát hiện sớm chênh lệch lớn giữa số kê khai và quan sát thực tế, trước khi đơn vị thẩm định vào cuộc.","Satellite estimates do not replace an inventory, but they flag large gaps between declared and observed figures early, before a verifier steps in."],

"meth.html":["<h2>Nguồn dữ liệu và phương pháp</h2><h3>Số liệu vệ tinh lấy từ đâu</h3><p>Phát thải từng cơ sở lấy từ Climate TRACE, liên minh độc lập theo dõi phát thải toàn cầu, qua API công khai phiên bản 6. Với nhà máy điện, Climate TRACE dùng ảnh vệ tinh quang học và hồng ngoại nhiệt để nhận biết khói và hơi nước, mô hình học máy suy ra mức vận hành rồi nhân với hệ số phát thải. Với thép và xi măng, ước tính dựa trên công suất, công nghệ, tín hiệu nhiệt và thống kê sản lượng.</p><p>Mỗi bản ghi có mức tin cậy riêng. Trang dùng mức tin cậy để gán độ bất định giả định, chỉnh được ở Cài đặt.</p><h3>Phần nào là công thức, phần nào là AI</h3><ul><li>Ước tính phát thải từ vệ tinh: Climate TRACE thực hiện bằng học máy; trang chỉ hiển thị và tổng hợp.</li><li>Hệ số công suất, cường độ, tỷ trọng, biến động: phép tính số học trên dữ liệu gốc.</li><li>Tính phát thải từ số liệu doanh nghiệp: công thức IPCC 2006 bậc 1, nhiên liệu nhân nhiệt trị nhân hệ số, cộng phát thải quá trình.</li><li>Kết luận đối chiếu và cờ kiểm tra: quy tắc cố định theo ngưỡng.</li><li>Công cụ CBAM: phát thải gắn với hàng nhân tỷ lệ phải nộp và giá chứng chỉ giả định.</li><li>Nút Giải thích bằng AI (khi có): mô hình ngôn ngữ diễn giải kết quả đã tính, không tính lại số.</li></ul><h3>Giới hạn cần biết</h3><ul><li>Đây là ước tính độc lập, chưa được cơ quan quản lý Việt Nam công nhận cho kiểm kê, thẩm định hay tính thuế carbon.</li><li>Climate TRACE ước tính phạm vi 1 tại cơ sở, nên phép đối chiếu chỉ so phạm vi 1.</li><li>Loại hình theo phân loại của Climate TRACE: điện theo nhiên liệu, thép theo tuyến luyện, xi măng là nhà máy có lò nung clinker.</li><li>Năm Climate TRACE ghi 0 hiển thị là chưa ghi nhận, không phải phát thải bằng 0.</li><li>Tỷ giá, giá carbon, giá CBAM, định mức đầu vào và ngưỡng khớp là giả định cần chuyên gia xác nhận.</li></ul>","<h2>Data sources and methods</h2><h3>Where the satellite numbers come from</h3><p>Plant emissions come from Climate TRACE, an independent coalition tracking global emissions, through its public API version 6. For power plants, Climate TRACE uses optical and thermal infrared imagery to detect plumes and steam; machine learning infers activity, which is multiplied by an emission factor. For steel and cement, estimates rely on capacity, technology, thermal signals and production statistics.</p><p>Each record has its own confidence level. The page maps confidence to an assumed uncertainty, editable in Settings.</p><h3>What is formula, what is AI</h3><ul><li>Satellite emission estimates: done by Climate TRACE with machine learning; this page only displays and aggregates.</li><li>Capacity factor, intensity, shares, changes: plain arithmetic on the source data.</li><li>Emissions from company data: IPCC 2006 Tier 1, fuel times heating value times factor, plus process emissions.</li><li>Comparison verdicts and data checks: fixed threshold rules.</li><li>CBAM tool: embedded emissions times payable share and an assumed certificate price.</li><li>Explain with AI button (when available): a language model explains results already computed, it does not recompute.</li></ul><h3>Limitations</h3><ul><li>These are independent estimates, not recognised by Vietnamese regulators for inventory, verification or carbon tax.</li><li>Climate TRACE estimates on-site scope 1, so comparisons cover scope 1 only.</li><li>Types follow the Climate TRACE classification: power by fuel, steel by route, cement as clinker kilns.</li><li>Years reported as 0 show as not recorded, not as zero emissions.</li><li>Exchange rates, carbon and CBAM prices, input norms and the match threshold are assumptions to be confirmed by experts.</li></ul>"],

let LANG=(()=>{const s=store.get('ct.lang');if(s==='vi'||s==='en')return s;return (navigator.language||'vi').toLowerCase().startsWith('vi')?'vi':'en';})();
function t(key,p){if(typeof MODE!=='undefined'&&MODE==='pub'&&T[key+'@pub'])key=key+'@pub';const e=T[key];let s=e?(LANG==='en'?e[1]:e[0]):key;if(typeof s==='function')return s(p||{});if(p)s=s.replace(/\{(\w+)\}/g,(m,k)=>p[k]!=null?p[k]:m);return s;}
const LOC=()=>LANG==='en'?'en-US':'vi-VN';
const nf=(v,d=1)=>v==null||!isFinite(v)?t('na'):v.toLocaleString(LOC(),{maximumFractionDigits:d,minimumFractionDigits:0});
const nfx=(v,d)=>v==null||!isFinite(v)?t('na'):v.toLocaleString(LOC(),{maximumFractionDigits:d,minimumFractionDigits:d});

function spark(vals,col,w=120,h=34){const v=vals.filter(x=>x!=null);if(v.length<2)return '';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;const x=i=>3+(w-6)*i/(vals.length-1),y=q=>h-4-(h-8)*(q-mn)/r;const pts=vals.map((q,i)=>q==null?null:[x(i),y(q)]).filter(Boolean);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex:none"><path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join('L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="${col}"/></svg>`;}

function parseCSV(txt){const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}else cur+=c;}if(cur||row.length){row.push(cur);rows.push(row);}return rows.filter(r=>r.some(x=>x!==''));}

  const top10=list.slice(0,10).reduce((s,a)=>s+emis(a,L),0);
  $('herostats').innerHTML=[
    [t('hs.total',{y:L}),nfx(tL/1e6,1)+`<small>${t('u.Mt')}</small>`,t('hs.totalH')],
    [t('hs.vs',{y:P}),sgn(pct(tL,tP)),t('hs.vsH',{d:nfx(Math.abs(tL-tP)/1e6,1),dir:(tL-tP)>0?t('more_'):t('less_'),y0:years()[0],p:sgn(pct(tL,tF))})],

    [t('hs.top'),nfx(top10/tL*100,0)+`%<small>${t('hs.topS')}</small>`,t('hs.topH',{n:list.length})]
  ].map(([l,v,h],i)=>`<div class="hs" data-drill="${['all','vs','n','top10'][i]}" data-y="${L}" role="button" tabindex="0" title="${esc(t('dr.hint'))}"><div class="l">${l}</div><div class="v">${v}</div><div class="h">${esc(h)}</div><span class="drill-ic" aria-hidden="true">↗</span></div>`).join('');

// ---------- IO estimate ----------
function fuelKey(a){const x=a.t||'';if(/coal/.test(x))return 'bituminous';if(/gas/.test(x))return 'gas';if(/oil/.test(x))return 'fo';return 'bituminous';}
const tPerTJ=f=>{const g=GWP[S.gwp];return (f.co2+f.ch4*g.ch4+f.n2o*g.n2o)/1000;};
const FU=k=>S.fuels.find(x=>x.k===k);
function ioCalc(a){const io=S.io,E=a.e||0,P=a.act||0;const ins=[],outs=[],notes=[];const M=v=>nf(v/1e6,2)+' '+t('u.mt');
  if(a.s==='electricity-generation'){const f=FU(fuelKey(a));const TJ=E/tPerTJ(f);const ft=TJ/f.ncv*1000;const hr=P?TJ*1e6/P:null;
    ins.push({k:t('io.fuelEq',{f:fuelN(f.k)}),v:M(ft)});ins.push({k:t('io.heat'),v:nf(TJ/1000,1)+' '+t('u.kTJ')});
    outs.push({k:t('io.gen'),v:nf(P/1e6,2)+' '+t('u.bkwh')});outs.push({k:t('emissions'),v:fmtE(E)+' '+uL(),co2:1});
    if(hr){outs.push({k:t('io.hr'),v:nf(hr,0)+' kJ/kWh',gl:'hr'});outs.push({k:t('io.eff'),v:nf(3600/hr*100,1)+'%'});}
    notes.push(t('io.nP',{f:fuelN(f.k).toLowerCase(),e:nf(tPerTJ(f),1),n:nf(f.ncv,1)}));}
  else if(a.s==='iron-and-steel'){const bf=/BF\/BOF/.test(a.t)&&!/EAF/.test(a.t);
    if(bf){ins.push({k:t('io.ore'),v:M(P*io.bfOre)});ins.push({k:t('io.coke'),v:M(P*io.bfCoal)});ins.push({k:t('io.lime'),v:M(P*io.bfLime)});ins.push({k:t('io.scrap'),v:M(P*io.bfScrap)});}
    else{ins.push({k:t('io.scrap'),v:M(P*io.eafScrap)});ins.push({k:t('io.elec'),v:nf(P*io.eafElec/1e6,2)+' '+t('u.bkwh')});}
    outs.push({k:t('io.steel'),v:M(P)});outs.push({k:t('emissions'),v:fmtE(E)+' '+uL(),co2:1});outs.push({k:t('intensity'),v:nfx(a.ef,2)+' '+t('u.tpt')});notes.push(bf?t('io.nBF'):t('io.nEAF'));}
  else{const perCk=S.proc.clinker*S.proc.ckd+io.ckFuel*tPerTJ(FU('bituminous'))/1000;const r=Math.min(1,(a.ef||0)/perCk);const ck=P*r;const proc=ck*S.proc.clinker*S.proc.ckd;const coal=ck*io.ckFuel/FU('bituminous').ncv;
    ins.push({k:t('io.meal'),v:M(ck*io.ckMeal)});ins.push({k:t('io.kilnCoal'),v:M(coal)});ins.push({k:t('io.add'),v:M(Math.max(0,P-ck))});
    outs.push({k:t('io.cement'),v:M(P)});outs.push({k:t('io.clinker'),v:M(ck)+', '+nf(r*100,0)+'%',gl:'clinker'});outs.push({k:t('emissions'),v:fmtE(E)+' '+uL()+', '+t('io.procShare',{p:nf(Math.min(100,proc/E*100),0)}),co2:1});
    notes.push(t('io.nC',{ef:nfx(a.ef,3),c:nf(S.proc.clinker*S.proc.ckd,2),g:nf(io.ckFuel,1)}));}
  return {ins,outs,notes};}
function ioBlock(a){const r=ioCalc(a);const bx=(o,cls)=>`<div class="bx ${cls||''} ${o.co2?'co2':''}"><div class="k">${esc(o.k)}${o.gl?qi(o.gl):''}</div><div class="v" title="${esc(o.v)}">${o.v}</div></div>`;
  return `<div class="io"><div class="col"><h6>${t('io.in')}</h6>${r.ins.map(o=>bx(o)).join('')}</div><div class="arr">→</div><div class="mid">${esc(shortName(a.n))}<div class="note" style="font-weight:500;margin-top:4px">${capTxt(a)}</div></div><div class="arr">→</div><div class="col"><h6>${t('io.out')}</h6>${r.outs.map(o=>bx(o,'out')).join('')}</div></div><p class="note" style="margin-top:8px">${r.notes.join(' ')} ${t('io.disc')}</p>`;}
function costBlock(e){const cur=S.carbon.usd;const list=[...new Set([cur,5,20,80])].sort((a,b)=>a-b).slice(0,4);
  return `<div class="cost">${list.map(u=>`<div class="c ${u===cur?'cur':''}"><div class="l">${nf(u,0)} USD/t${u===cur?', '+t('selected'):''}</div><div class="v">${money(carbonCost(e,u))}</div></div>`).join('')}</div><p class="note" style="margin-top:6px">${t('cost.note',{f:nf(S.carbon.free,0),fx:nf(S.fx.usd,0)})}</p>`;}

function smartSummary(a){
  const ys=years(),L=LAST(),P=L-1;const v=emis(a,L),vp=emis(a,P),v0=emis(a,ys[0]);
  const same=DATA.assets.filter(b=>b.s===a.s&&(emis(b,L)||0)>0).sort((x,y)=>emis(y,L)-emis(x,L));const rank=same.findIndex(b=>b.id===a.id)+1;
  const avg=same.reduce((s,b)=>s+emis(b,L),0)/same.length;
  const peers=DATA.assets.filter(b=>b.s===a.s&&b.t===a.t&&b.ef>0).map(b=>b.ef).sort((x,y)=>x-y);const med=peers.length?peers[Math.floor(peers.length/2)]:null;
  const parts=[];
  if(v){parts.push(t('sum.size',{v:fmtE(v),u:uL(),y:L,r:rank,n:same.length,s:secN(a.s).toLowerCase(),k:nf(v/avg,1)}));}
  else parts.push(t('sum.noL',{y:L}));
  if(v&&vp){const d=pct(v,vp);parts.push(Math.abs(d)<2?t('sum.flat',{p:P}):t(d>0?'sum.up':'sum.down',{p:P,d:nfx(Math.abs(d),1)}));}
  if(v&&v0&&ys[0]!==L){const d=pct(v,v0);parts.push(t('sum.long',{y0:ys[0],dir:d>0?t('rose'):t('fell'),d:nfx(Math.abs(d),0)}));}
  if(med&&a.ef){const r=a.ef/med;parts.push(r>1.05?t('sum.efHi',{p:nf((r-1)*100,0)}):r<0.95?t('sum.efLo',{p:nf((1-r)*100,0)}):t('sum.efMid'));}
  parts.push(t('sum.conf.'+((a.c||'').replace(' ','')||'na')));
  return parts.join(' ');
}

  'cement':[['clinker','kc.clk','clk'],['cem','kc.cem','prod'],['bituminous','kc.coal','fuel'],['fo','kc.fo','fuel'],['buy','kc.buy','elec']],
  'iron-and-steel':[['bof','kc.bof','bof'],['eaf','kc.eaf','eaf'],['bituminous','kc.coal','fuel'],['gas','kc.gas','fuel'],['buy','kc.buy','elec']]};

function kRows(){const d=WS.kk[kKey()];return d&&d.rows&&d.rows.length?d.rows:Array.from({length:12},()=>({}));}
const kLog=()=>{const d=WS.kk[kKey()];return (d&&d.log)||[];};
function kSave(rows,src,meta){const all=WS.kk;const prev=all[kKey()]||{};const old=prev.rows||[];const log=(prev.log||[]).slice();const now=new Date();const ts=now.toISOString();
  const diffs=[];for(let i=0;i<12;i++){const a=old[i]||{},b=rows[i]||{};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{const o=a[k]??null,n=b[k]??null;if(o!==n)diffs.push({m:i,c:k,o,n});});}

function kCalc(a,rows){const cols=KCOLS[a.s];
  const months=rows.map((r,i)=>{let fuel=0,proc=0,TJ=0;cols.forEach(([k,,type])=>{const v=r&&r[k];if(!(v>0))return;
      if(type==='fuel'){const f=FU(k);const tj=v/1000*f.ncv;TJ+=tj;fuel+=tj*tPerTJ(f);}else if(type==='clk')proc+=v*S.proc.clinker*S.proc.ckd;else if(type==='bof')proc+=v*S.proc.bof;else if(type==='eaf')proc+=v*S.proc.eaf;});

function kSample(){const a=byId(INV.fac),y=INV.year;const E=emis(a,y)||a.e;const per=k=>{const f=FU(k);return f.ncv/1000*tPerTJ(f);};

function cSample(){const a=byId(CHK.fac),sat=emis(a,CHK.year);CHK.mode='fuel';$('cMode').value='fuel';cInputs();const per=k=>{const f=FU(k);return f.ncv/1000*tPerTJ(f);};const set=(sel,v)=>{const el=document.querySelector(sel);if(el)el.value=Math.round(v);};

const EF_RANGE={'electricity-generation|coal':[0.8,1.3],'electricity-generation|gas':[0.33,0.8],'electricity-generation|gas, other_fossil':[0.33,0.8],'electricity-generation|gas, oil':[0.33,0.9],'electricity-generation|gas, oil, other_fossil':[0.33,0.9],'electricity-generation|oil':[0.6,1.1],'electricity-generation|coal, gas, other_fossil':[0.33,1.3],

  const near=(a,f,tol,same)=>{const v=f(a);if(v==null)return 0;return DATA.assets.filter(b=>same(a,b)&&f(b)!=null&&Math.abs(f(b)-v)<=tol).length;};

  const kk=WS.kk;const ys=years();const out={};
  DATA.assets.forEach(a=>{const fl=[];let sc=0;
    // A. source confidence
    const cp=CONF_PTS[a.c||'']??6;sc+=cp;fl.push({k:'conf',lv:cp>=25?'ok':cp>=17?'warn':'bad',p:{c:confN(a.c)}});
    // B. plant-specific vs model default
    const u=utilOf(a);const nU=near(a,utilOf,0.003,sameS);const nE=near(a,b=>b.ef,0.0005,sameT);let b=25;
    if(nU>=3){b-=10;fl.push({k:'defAct',lv:'warn',p:{v:nfx(u*100,1),n:nU}});}
    if(nE>=3){b-=10;fl.push({k:'defEf',lv:'warn',p:{n:nE}});}
    sc+=b;
    // C. physical plausibility
    const rg=EF_RANGE[a.s+'|'+a.t];let c=20;
    if(rg&&a.ef!=null&&(a.ef<rg[0]||a.ef>rg[1])){c=5;fl.push({k:'efRange',lv:'bad',p:{v:nfx(a.ef,3),lo:rg[0],hi:rg[1]}});}
    if(u!=null&&(u>1||u<0.05)){c=Math.min(c,10);fl.push({k:'util',lv:u>1?'bad':'warn',p:{v:nf(u*100,1)}});}
    sc+=c;
    // D. time series
    const vals=ys.map(y=>emis(a,y));const n=vals.filter(v=>v!=null).length;let d=Math.round(15*n/ys.length);
    if(n<ys.length)fl.push({k:'gap',lv:'warn',p:{n:ys.length-n}});
    for(let i=1;i<ys.length;i++){const p0=vals.at(i-1),p1=vals.at(i);if(p0&&p1&&Math.abs(p1/p0-1)>0.6){d=Math.max(0,d-5);fl.push({k:'jump',lv:'warn',p:{p:sgn((p1/p0-1)*100),y:ys.at(i)}});}}
    sc+=d;
    // E. independent check from company inventory
    let e=0,inv=null;Object.entries(kk).forEach(([key,v])=>{const [id,y]=key.split('|');if(id!==a.id||!(v&&v.s1>0&&v.n>0))return;const s=emis(a,+y);const ok=s?Math.abs(v.s1/s-1)<=S.match/100:false;if(!inv||ok)inv={y,ok,full:v.n>=12};});

      o(t('cv.energyOut'),nf(tj,2)+' TJ · '+nf(tj*1000/3.6,0)+' MWh');o('CO2',nf(co2,1)+' t');o('CH4',nf(ch4*1000,1)+' kg');o('N2O',nf(n2o*1000,1)+' kg');o('CO2e ('+S.gwp+')',nf(tot,1)+' t',true);o(t('cv.perT'),nfx(tot/(V||1),3)+' t CO2e/t');o(t('cv.costCO2'),money(carbonCost(tot)));

    else if(c==='money'){const vnd=st.u==='VND'?V:st.u==='USD'?V*S.fx.usd:V*S.fx.eur;['VND','USD','EUR'].forEach(k=>o(k,nf(vndTo(vnd,k),k==='VND'?0:2)+' · '+money(vnd,k),k===st.u));note=t('cv.fxN',{u:nf(S.fx.usd,0),e:nf(S.fx.eur,0)});}
    else {const vnd=st.u==='VND'?V:st.u==='USD'?V*S.fx.usd:V*S.fx.eur;['VND','USD','EUR'].forEach(k=>o(k+'/t CO2e',nf(vndTo(vnd,k),k==='VND'?0:2),k===st.u));const big=DATA.assets.slice().sort((a,b)=>b.e-a.e)[0];o(t('cv.bigPlant',{n:shortName(big.n)}),money(big.e*vnd),false);note=t('cv.priceN',{n:shortName(big.n),e:fmtE(big.e)+' '+uL()});}
    $('cvOut').innerHTML=out.map(([l,v,hi])=>`<div class="o${hi?' hi':''}"><span>${esc(l)}</span><span class="v">${esc(v)}</span></div>`).join('');$('cvNote').textContent=note;LOOK._txt=out.map(([l,v])=>l+': '+v).join('\n');};

    else if(x.dataset.unc!=null)S.unc[x.dataset.unc]=v;else if(x.dataset.fi!=null)S.fuels[+x.dataset.fi][x.dataset.fk]=v;else if(x.dataset.pk)S.proc[x.dataset.pk]=v;else if(x.dataset.ik)S.io[x.dataset.ik]=v;
    else if(x.id==='sCusd')S.carbon.usd=v;else if(x.id==='sCfree'&&v<=100)S.carbon.free=v;else if(x.id==='sBeur')S.cbam.eur=v;else if(x.id==='sBvn')S.cbam.vn=v;else if(x.id==='sBmark')S.cbam.mark=v;else return;
    saveS();$('setMsg').textContent=t('saved');};
  $('btnSetExport').onclick=()=>saveFile('settings.json',JSON.stringify(S,null,2),'application/json');
  $('fileSet').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{S=mergeS(JSON.parse(rd.result));saveS();refreshAll();toast(t('set.impOk'));}catch(err){$('setMsg').textContent=t('set.impErr');}};rd.readAsText(f);};
  $('btnSetReset').onclick=()=>{S=mergeS(CFG||{});store.del('ct.settings');applyTheme();refreshAll();toast(t('set.resetOk'));};
  $('fileData').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=f.name.endsWith('.json')?JSON.parse(rd.result):csvToData(String(rd.result));if(d.assets&&d.assets[0]&&d.assets[0].name!==undefined)d.assets=d.assets.map(rec);const nd=normalize(d);if(!nd.assets.length)throw new Error(t('set.noRows'));DATA=Object.assign(nd,{no2:DATA.no2});store.set('ct.data',d);refreshAll();toast(t('set.dataOk',{n:DATA.assets.length,f:f.name}));}catch(err){$('dataMsg').textContent=t('set.dataErr')+' '+(err.message||'');}};rd.readAsText(f);};
  $('btnDataReset').onclick=()=>{store.del('ct.data');loadData().then(()=>toast(t('set.dataRst')));};
};
function csvToData(txt){
  const r=parseCSV(txt);const h=r[0].map(s=>s.trim());const ix=k=>h.indexOf(k);
  if(ix('id')<0||ix('emissions_t_co2e')<0||ix('sector')<0)throw new Error(t('set.csvCols'));
  const yc=h.map((k,i)=>/^e\d{4}$/.test(k)?[i,+k.slice(1)]:null).filter(Boolean);const N=v=>v===''||v==null?null:+v;const assets=[],yearly={};
  r.slice(1).forEach(c=>{const g=k=>ix(k)<0?'':c[ix(k)];const a=rec({id:g('id'),name:g('name'),sector:g('sector'),asset_type:g('asset_type'),lon:N(g('lon')),lat:N(g('lat')),capacity:N(g('capacity')),capacity_units:g('capacity_units'),activity:N(g('activity')),activity_units:g('activity_units'),ef:N(g('ef')),emissions_t_co2e:N(g('emissions_t_co2e')),owner:g('owner'),rank2025:N(g('rank2025')),conf_co2:g('conf_co2')});assets.push(a);yc.forEach(([i,y])=>{if(c[i]!==''&&c[i]!=null)(yearly[a.id]=yearly[a.id]||{})[y]=+c[i];});});
  return {assets,yearly,meta:{source:'Upload',fetched:new Date().toISOString().slice(0,10),baseYear:2024}};}

// ---------- BOOT ----------
async function tryFetch(p){try{const r=await fetch(p,{cache:'no-store'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function loadData(){
  let raw=null;const [ext,yr,no2,cfg]=await Promise.all([tryFetch('data/assets.json'),tryFetch('data/yearly.json'),tryFetch('data/no2.json'),tryFetch('config/settings.json')]);
  if(ext&&Array.isArray(ext.assets))raw={assets:ext.assets.map(rec),yearly:(yr&&yr.yearly)||{},meta:ext.meta||{}};
  else raw={assets:SEED.assets.map(rec),yearly:SEED.yearly,meta:SEED.meta};
  const up=store.get('ct.data');if(up&&up.assets){raw=up;if(raw.assets[0]&&raw.assets[0].name!==undefined)raw.assets=raw.assets.map(rec);}
  CFG=cfg;if(cfg&&!store.get('ct.settings')){S=mergeS(cfg);applyTheme();}
  DATA=normalize(raw);DATA.no2=(no2&&no2.series)||{};DATA.no2meta=(no2&&no2.meta)||null;
  renderStatic();renderHero();
  let v=(location.hash||'').slice(1);if(/^p-/.test(v)&&byId(v.slice(2))){PROF.id=v.slice(2);v='profile';}const direct=v==='profile'||!!VIEWS.find(x=>x.id===v);if(!direct)v='home';show(v,{noScroll:true});renderCmpBar();if(!direct)openWelcome();
}
loadData();

})();</script></body></html>
