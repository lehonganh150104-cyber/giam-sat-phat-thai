name: Chạy thử NO2 cho 3 nhà máy khảo sát
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/no2_3nm.py", ".github/workflows/no2-3nm.yml"]
permissions:
  contents: write
jobs:
  no2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm tra khóa Copernicus
        run: |
          mkdir -p analysis/no2_3nm
          if [ -z "$CDSE_CLIENT_ID" ]; then echo "Chưa khai báo CDSE_CLIENT_ID trong GitHub Secrets" | tee analysis/no2_3nm/log.txt; fi
      - name: Lấy NO2 và tính theo tháng
        if: ${{ env.CDSE_CLIENT_ID != '' }}
        run: python3 scripts/no2_3nm.py
      - name: Lưu kết quả (kể cả khi lỗi, để xem nhật ký)
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add analysis
          git diff --cached --quiet || git commit -m "Kết quả chạy thử NO2 cho 3 nhà máy $(date +%F)"
          git pull --rebase -q origin main || true
          git push
