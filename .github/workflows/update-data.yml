name: Cập nhật dữ liệu vệ tinh
on:
  schedule:
    - cron: "17 1 * * 1"   # 8 giờ 17 sáng thứ Hai, giờ Việt Nam
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Climate TRACE
        run: python3 scripts/update_climatetrace.py
      - name: NO2 Sentinel-5P (chỉ chạy khi đã khai báo khóa Copernicus)
        if: ${{ env.CDSE_CLIENT_ID != '' }}
        run: python3 scripts/update_no2_cdse.py
      - name: Lưu thay đổi
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu $(date +%F)"
          git push
